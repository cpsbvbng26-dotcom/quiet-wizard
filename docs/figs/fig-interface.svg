<g class="f-tx" font-size="13" text-anchor="middle"><text x="80" y="134">和　＋・＋</text><text x="80" y="156">線が太る</text><text x="240" y="134">偏　＋・−</text><text x="240" y="156">線が細る</text><text x="400" y="134">衝　−・−</text><text x="400" y="156">両の蓄積が増す</text><text x="400" y="178">相は＋（潜める和）</text><text x="240" y="30">向き合う面だけを見る。人の属性は置かない</text><text x="240" y="200" font-size="11">細い線の辺は相＋、太い帯の辺は相−</text></g>
