name: 検査

# push と PR のたびに回す。原典が一字も変わっていないこと、どの頁にも断りと開示があること、外へ何も要求しないこと、
# site/ が src/ から作ったものと同じことを verification/check.js が確かめ、続けて同じ検査を壊して落ちることを確かめる。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 原典・断り・開示・外への要求・生成物・壊して確かめる
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node verification/check.js
